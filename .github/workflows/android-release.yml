name: Build and Release Samsung Printer APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional custom release tag (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Signed Android APK
    runs-on: ubuntu-latest
    # Skip workflow runs triggered by the release action pushing a new auto-tag
    if: "!startsWith(github.ref, 'refs/tags/v1.0.') || github.event_name == 'workflow_dispatch'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using repository release signing keystore from GitHub Secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::notice::KEYSTORE_BASE64/STORE_PASSWORD/KEY_PASSWORD secrets not set; generating a release upload keystore for this build."
            GEN_PASS=$(openssl rand -hex 16)
            echo "::add-mask::$GEN_PASS"
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -storepass "$GEN_PASS" -alias upload -keypass "$GEN_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Samsung Printer Release,O=Personal,C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$GEN_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$GEN_PASS" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests and build release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Prepare release tag and APK file
        id: prep
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${{ github.run_number }}-${SHORT_SHA}"
          fi
          APK_NAME="Samsung-Printer-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.apk_name }}
          path: ${{ steps.prep.outputs.apk_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Samsung Printer ${{ steps.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.prep.outputs.apk_name }}
